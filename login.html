<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Firebase Authentication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 45px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(10px);
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo p { color: #666; font-size: 14px; margin-top: 8px; }

        .method-tabs { display: flex; gap: 10px; margin-bottom: 30px; }
        .tab-btn {
            flex: 1; padding: 12px; border: 2px solid #e0e0e0; background: white;
            border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600;
            color: #666; transition: all 0.3s ease;
        }
        .tab-btn:hover { border-color: #23ed99ff; color: #0f8156ff; }
        .tab-btn.active {
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            color: white; border-color: transparent;
            box-shadow: 0 4px 12px rgba(35, 237, 153, 0.4);
        }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 12px; font-size: 15px; transition: all 0.3s ease; background: white;
        }
        .input-group input:focus {
            outline: none; border-color: #23ed99ff;
            box-shadow: 0 0 0 3px rgba(35, 237, 153, 0.1);
        }

        .forgot-password { text-align: right; margin-bottom: 25px; }
        .forgot-password a { color: #0f8156ff; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
        .forgot-password a:hover { text-decoration: underline; }

        .login-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(35, 237, 153, 0.3);
        }
        .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(35, 237, 153, 0.4); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            display: flex; align-items: center; margin: 30px 0;
            color: #999; font-size: 13px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .divider span { padding: 0 15px; }

        .social-buttons { display: flex; flex-direction: column; gap: 12px; }

        .google-btn, .facebook-btn {
            width: 100%; padding: 14px; background: white; border: 2px solid #e0e0e0;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px;
        }
        .google-btn:hover:not(:disabled) { border-color: #4285F4; box-shadow: 0 2px 8px rgba(66, 133, 244, 0.2); }
        .facebook-btn { background: #1877f2; color: white; border-color: #1877f2; }
        .facebook-btn:hover:not(:disabled) { background: #166fe5; box-shadow: 0 2px 8px rgba(24, 119, 242, 0.3); }
        .google-btn:disabled, .facebook-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .social-icon { width: 20px; height: 20px; }

        .error-message {
            background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px; display: none;
        }
        .success-message {
            background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px; display: none;
        }
        .hidden { display: none; }

        .otp-box {
            width: 46px; height: 54px;
            border: 2px solid #e0e0e0; border-radius: 12px;
            text-align: center; font-size: 22px; font-weight: 700;
            color: #0f8156; background: white;
            transition: all 0.2s ease; outline: none;
        }
        .otp-box:focus {
            border-color: #23ed99; box-shadow: 0 0 0 3px rgba(35,237,153,0.15);
        }
        .otp-box.filled {
            border-color: #0f8156; background: #f0fff8;
        }
        .otp-box.shake {
            animation: otpShake 0.4s ease;
        }
        @keyframes otpShake {
            0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
        }

        @media (max-width: 480px) {
            .login-container { padding: 40px 30px; }
            .logo h1 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Welcome Back</h1>
            <p>Login to your account</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="method-tabs">
            <button class="tab-btn active" id="emailTab">Email</button>
            <button class="tab-btn" id="phoneTab">Phone</button>
        </div>

        <form id="loginForm">
            <div id="emailForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your.email@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="emailPassword">Password</label>
                    <input type="password" id="emailPassword" placeholder="Enter your password" required>
                </div>
                <div class="forgot-password">
                    <a id="forgotPasswordLink">Forgot Password?</a>
                </div>
                <button type="submit" class="login-btn" id="emailLoginBtn">Login with Email</button>
            </div>

            <div id="phoneForm" class="hidden">

                <!-- Step 1: Phone number entry -->
                <div id="phoneStep1">
                    <div class="input-group">
                        <label>Phone Number</label>
                        <div style="display:flex;gap:8px;align-items:stretch;">
                            <select id="countryCode" style="padding:12px 8px;border:2px solid #e0e0e0;border-radius:12px;font-size:14px;background:white;cursor:pointer;flex-shrink:0;min-width:95px;">
                                <option value="+63">🇵🇭 +63</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                                <option value="+61">🇦🇺 +61</option>
                                <option value="+65">🇸🇬 +65</option>
                                <option value="+60">🇲🇾 +60</option>
                                <option value="+66">🇹🇭 +66</option>
                                <option value="+62">🇮🇩 +62</option>
                                <option value="+84">🇻🇳 +84</option>
                                <option value="+91">🇮🇳 +91</option>
                            </select>
                            <input type="tel" id="phone" placeholder="9212364567"
                                inputmode="numeric" maxlength="15"
                                style="flex:1;padding:14px 16px;border:2px solid #e0e0e0;border-radius:12px;font-size:15px;">
                        </div>
                        <small style="color:#888;font-size:12px;margin-top:6px;display:block;">Enter number without leading 0 (e.g. 9212364567)</small>
                    </div>
                    <div id="recaptcha-container" style="margin:16px 0;display:flex;justify-content:center;"></div>
                    <button type="submit" class="login-btn" id="phoneLoginBtn">Send Verification Code</button>
                </div>

                <!-- Step 2: OTP entry -->
                <div id="phoneStep2" style="display:none;">
                    <div style="text-align:center;margin-bottom:24px;">
                        <div style="font-size:44px;margin-bottom:10px;">📱</div>
                        <h3 style="color:#0f8156;font-size:18px;font-weight:700;margin-bottom:6px;">Check your phone</h3>
                        <p id="otpSentMsg" style="color:#666;font-size:13px;">We sent a 6-digit code to your number</p>
                    </div>
                    <div id="otpBoxes" style="display:flex;gap:8px;justify-content:center;margin-bottom:24px;">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                        <input class="otp-box" type="text" maxlength="1" inputmode="numeric" pattern="[0-9]">
                    </div>
                    <button type="button" class="login-btn" id="verifyCodeBtn" disabled>Verify & Login</button>
                    <div style="text-align:center;margin-top:16px;">
                        <span style="color:#888;font-size:13px;">Didn't receive it? </span>
                        <a id="resendCodeBtn" style="color:#0f8156;font-weight:700;cursor:pointer;font-size:13px;">Resend code</a>
                        <span id="resendTimer" style="color:#888;font-size:13px;display:none;"> in <span id="timerCount">30</span>s</span>
                    </div>
                    <div style="text-align:center;margin-top:10px;">
                        <a id="changeNumberBtn" style="color:#aaa;font-size:12px;cursor:pointer;">← Change number</a>
                    </div>
                </div>

            </div>
        </form>

        <div class="divider"><span>OR</span></div>

        <div class="social-buttons">
            <button class="google-btn" id="googleLoginBtn">
                <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <button class="facebook-btn" id="facebookLoginBtn">
                <svg class="social-icon" viewBox="0 0 24 24" fill="white">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Continue with Facebook
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            getRedirectResult,
            signInWithEmailAndPassword,
            signInWithPhoneNumber,
            RecaptchaVerifier,
            signInWithPopup,
            signInWithRedirect,
            GoogleAuthProvider,
            FacebookAuthProvider,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAu9hOwjiuAl9PCh50HefMGZU9XDosu68I",
            authDomain: "wattawaste-d3503.firebaseapp.com",
            databaseURL: "https://wattawaste-d3503-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wattawaste-d3503",
            storageBucket: "wattawaste-d3503.firebasestorage.app",
            messagingSenderId: "842761118644",
            appId: "1:842761118644:web:ddef65fd892486f67f88e1",
            measurementId: "G-33Z8K3NBY1"
        };

        const app      = initializeApp(firebaseConfig);
        const auth     = getAuth(app);
        const database = getDatabase(app);

        const ADMIN_EMAILS = [
            'tan.heannamenoella.rebolledo@gmail.com',
            'quimoragwyneth61501@gmail.com'
        ];

        // ── DOM ────────────────────────────────────────────────────────────────────
        const emailTab           = document.getElementById('emailTab');
        const phoneTab           = document.getElementById('phoneTab');
        const emailFormDiv       = document.getElementById('emailForm');
        const phoneFormDiv       = document.getElementById('phoneForm');
        const loginForm          = document.getElementById('loginForm');
        const errorMessage       = document.getElementById('errorMessage');
        const successMessage     = document.getElementById('successMessage');
        const googleLoginBtn     = document.getElementById('googleLoginBtn');
        const facebookLoginBtn   = document.getElementById('facebookLoginBtn');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        let recaptchaVerifier;
        let confirmationResult;
        // ✅ This flag prevents onAuthStateChanged from auto-redirecting
        // when the page first loads (user already logged in scenario)
        let isLoggingIn = false;

        // ── Helpers ────────────────────────────────────────────────────────────────
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }
        function getDestination(email) {
            return ADMIN_EMAILS.includes(email) ? 'admin_dashboard.php' : 'index.php';
        }
        function redirectNow(email) {
            const dest = getDestination(email);
            console.log('✅ Redirecting to:', dest);
            window.location.replace(dest);
        }
        function getErrorMessage(code) {
            const map = {
                'auth/invalid-email': 'Invalid email address.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your connection.',
                'auth/popup-closed-by-user': 'Sign-in was cancelled.',
                'auth/cancelled-popup-request': 'Sign-in was cancelled.',
                'auth/popup-blocked': 'Popup was blocked by your browser.',
                'auth/invalid-phone-number': 'Invalid phone number format.',
                'auth/missing-phone-number': 'Please enter a phone number.',
                'auth/account-exists-with-different-credential': 'An account already exists with this email using a different sign-in method.',
                'auth/operation-not-allowed': 'This sign-in method is not enabled.',
                'auth/unauthorized-domain': 'This domain is not authorized. Contact support.'
            };
            return map[code] || 'An error occurred. Please try again.';
        }

        // ── Sync user to Realtime Database ─────────────────────────────────────────
        async function syncUserToDatabase(user) {
            if (!user || user.isAnonymous) return;
            let provider = 'email', providerId = 'password';
            if (user.providerData?.length > 0) {
                providerId = user.providerData[0].providerId;
                if (providerId === 'google.com')   provider = 'google';
                if (providerId === 'facebook.com') provider = 'facebook';
                if (providerId === 'phone')        provider = 'phone';
            }
            const userRef = ref(database, 'users/' + user.uid);
            const userData = {
                name: user.displayName || user.email || user.phoneNumber || 'User',
                Username: user.displayName || user.email || user.phoneNumber || 'User',
                email: user.email || 'N/A',
                Email: user.email || 'N/A',
                role: 'User', Role: 'User',
                status: 'Active', Status: 'Active',
                provider, providerId,
                photoURL: user.photoURL || null,
                phoneNumber: user.phoneNumber || null,
                emailVerified: user.emailVerified || false,
                lastLogin: new Date().toLocaleString(),
                lastActive: new Date().toLocaleString(),
                createdAt: user.metadata.creationTime,
                lastSignInTime: user.metadata.lastSignInTime
            };
            try {
                const snap = await get(userRef);
                if (snap.exists()) {
                    await update(userRef, {
                        lastLogin: userData.lastLogin,
                        lastActive: userData.lastActive,
                        lastSignInTime: userData.lastSignInTime,
                        emailVerified: userData.emailVerified,
                        photoURL: userData.photoURL,
                        phoneNumber: userData.phoneNumber
                    });
                } else {
                    await set(userRef, userData);
                }
            } catch (e) { console.error('DB sync error:', e); }
        }

        // ── STEP 1: Handle redirect result (popup-blocked fallback) ─────────────
        // If popup was blocked and we fell back to redirect, catch the result here.
        try {
            const result = await getRedirectResult(auth);
            if (result?.user) {
                console.log('✅ getRedirectResult got user:', result.user.email);
                isLoggingIn = true;
                await syncUserToDatabase(result.user);
                sessionStorage.setItem('userEmail', result.user.email || '');
                sessionStorage.setItem('userName',  result.user.displayName || '');
                sessionStorage.setItem('userId',    result.user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(result.user.email), 1000);
            }
        } catch (err) {
            console.error('getRedirectResult error:', err.code, err.message);
            if (err.code && err.code !== 'auth/no-current-user') {
                showError(getErrorMessage(err.code));
            }
        }

        // ── STEP 2: onAuthStateChanged — only used for already-logged-in users ─────
        // This fires when Firebase detects a persisted session (e.g. user refreshes
        // the login page while already logged in). We redirect them to index.php.
        // The isLoggingIn flag prevents this from double-firing with step 1.
        onAuthStateChanged(auth, (user) => {
            if (isLoggingIn) return; // already being handled above
            if (user && !user.isAnonymous) {
                // User is already logged in — skip the login page
                console.log('User already logged in, redirecting to index...');
                redirectNow(user.email);
            }
        });

        // ── Tab Switching ──────────────────────────────────────────────────────────
        emailTab.addEventListener('click', () => {
            emailTab.classList.add('active'); phoneTab.classList.remove('active');
            emailFormDiv.classList.remove('hidden'); phoneFormDiv.classList.add('hidden');
            hideMessages();
        });
        phoneTab.addEventListener('click', () => {
            phoneTab.classList.add('active'); emailTab.classList.remove('active');
            phoneFormDiv.classList.remove('hidden'); emailFormDiv.classList.add('hidden');
            hideMessages(); initRecaptcha();
        });

        // ── reCAPTCHA (invisible — no checkbox needed) ────────────────────────────
        function initRecaptcha() {
            if (!recaptchaVerifier) {
                try {
                    recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                        size: 'normal',
                        callback: () => console.log('reCAPTCHA verified'),
                        'expired-callback': () => {
                            recaptchaVerifier = null;
                            initRecaptcha();
                        }
                    });
                    recaptchaVerifier.render();
                } catch (e) { console.error('reCAPTCHA init error:', e); }
            }
        }

        // ── OTP Box Logic ──────────────────────────────────────────────────────────
        function setupOtpBoxes() {
            const boxes = document.querySelectorAll('.otp-box');
            const verifyBtn = document.getElementById('verifyCodeBtn');

            boxes.forEach((box, i) => {
                box.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/\D/g, '');
                    box.value = val;
                    box.classList.toggle('filled', val !== '');

                    // Auto-advance to next box
                    if (val && i < boxes.length - 1) boxes[i + 1].focus();

                    // Enable verify button when all 6 filled
                    const code = [...boxes].map(b => b.value).join('');
                    verifyBtn.disabled = code.length !== 6;

                    // Auto-submit when complete
                    if (code.length === 6) {
                        setTimeout(() => verifyBtn.click(), 300);
                    }
                });

                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !box.value && i > 0) {
                        boxes[i - 1].focus();
                        boxes[i - 1].value = '';
                        boxes[i - 1].classList.remove('filled');
                    }
                });

                // Handle paste — fill all boxes from clipboard
                box.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                    [...boxes].forEach((b, idx) => {
                        b.value = pasted[idx] || '';
                        b.classList.toggle('filled', !!pasted[idx]);
                    });
                    const code = [...boxes].map(b => b.value).join('');
                    verifyBtn.disabled = code.length !== 6;
                    if (code.length === 6) setTimeout(() => verifyBtn.click(), 300);
                    boxes[Math.min(pasted.length, 5)].focus();
                });
            });
        }

        // ── Resend timer ───────────────────────────────────────────────────────────
        function startResendTimer() {
            let seconds = 30;
            const resendBtn   = document.getElementById('resendCodeBtn');
            const resendTimer = document.getElementById('resendTimer');
            const timerCount  = document.getElementById('timerCount');
            resendBtn.style.display   = 'none';
            resendTimer.style.display = 'inline';
            timerCount.textContent    = seconds;
            const interval = setInterval(() => {
                seconds--;
                timerCount.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    resendTimer.style.display = 'none';
                    resendBtn.style.display   = 'inline';
                }
            }, 1000);
        }

        // ── Send OTP ───────────────────────────────────────────────────────────────
        async function sendOtp() {
            const countryCode = document.getElementById('countryCode').value;
            const rawNumber   = document.getElementById('phone').value.trim();
            const localNumber = rawNumber.replace(/\D/g, '').replace(/^0+/, '');
            const fullNumber  = countryCode + localNumber;

            // Validate number
            if (localNumber.length < 7) {
                showError('Please enter a valid phone number (at least 7 digits).');
                return;
            }

            // Validate reCAPTCHA was completed
            if (!recaptchaVerifier) {
                showError('reCAPTCHA not loaded. Please refresh the page.');
                return;
            }

            const phoneLoginBtn = document.getElementById('phoneLoginBtn');
            phoneLoginBtn.disabled    = true;
            phoneLoginBtn.textContent = 'Sending code...';
            hideMessages();

            try {
                console.log('Sending OTP to:', fullNumber);
                confirmationResult = await signInWithPhoneNumber(auth, fullNumber, recaptchaVerifier);
                console.log('OTP sent successfully');

                // Switch to OTP step
                document.getElementById('phoneStep1').style.display = 'none';
                document.getElementById('phoneStep2').style.display = 'block';
                document.getElementById('otpSentMsg').textContent   = `Code sent to ${fullNumber}`;
                setupOtpBoxes();
                document.querySelector('.otp-box').focus();
                startResendTimer();
                showSuccess('Code sent! Check your SMS.');

            } catch (err) {
                console.error('sendOtp error:', err.code, err.message);

                // Show a user-friendly message
                let msg = 'Failed to send code. Please try again.';
                if (err.code === 'auth/invalid-phone-number')   msg = 'Invalid phone number. Check the format and try again.';
                if (err.code === 'auth/too-many-requests')      msg = 'Too many attempts. Please wait a few minutes.';
                if (err.code === 'auth/captcha-check-failed')   msg = 'Please complete the reCAPTCHA first.';
                if (err.code === 'auth/missing-phone-number')   msg = 'Please enter a phone number.';
                if (err.code === 'auth/quota-exceeded')         msg = 'SMS quota exceeded. Try again later.';

                showError(msg);
                phoneLoginBtn.disabled    = false;
                phoneLoginBtn.textContent = 'Send Verification Code';

                // Always reset reCAPTCHA after error
                try {
                    if (recaptchaVerifier) { recaptchaVerifier.clear(); }
                } catch(e) {}
                recaptchaVerifier = null;
                initRecaptcha();
            }
        }

        // ── Email / Phone Form Submit ──────────────────────────────────────────────
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            if (!phoneFormDiv.classList.contains('hidden')) { await sendOtp(); return; }

            // Email login
            const emailLoginBtn = document.getElementById('emailLoginBtn');
            const email    = document.getElementById('email').value;
            const password = document.getElementById('emailPassword').value;
            emailLoginBtn.disabled = true; emailLoginBtn.textContent = 'Logging in...';
            try {
                isLoggingIn = true;
                const { user } = await signInWithEmailAndPassword(auth, email, password);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email);
                sessionStorage.setItem('userId', user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                isLoggingIn = false;
                showError(getErrorMessage(err.code));
                emailLoginBtn.disabled = false; emailLoginBtn.textContent = 'Login with Email';
            }
        });

        // ── Verify OTP ─────────────────────────────────────────────────────────────
        document.getElementById('verifyCodeBtn').addEventListener('click', async () => {
            hideMessages();
            const verifyBtn = document.getElementById('verifyCodeBtn');
            const boxes     = document.querySelectorAll('.otp-box');
            const code      = [...boxes].map(b => b.value).join('');

            if (code.length !== 6) { showError('Please enter the full 6-digit code.'); return; }

            verifyBtn.disabled    = true;
            verifyBtn.textContent = '⏳ Verifying...';

            try {
                isLoggingIn = true;
                const { user } = await confirmationResult.confirm(code);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userPhone', user.phoneNumber);
                sessionStorage.setItem('userId',    user.uid);
                showSuccess('✅ Phone verified! Logging in...');
                setTimeout(() => window.location.replace('index.php'), 1000);
            } catch (err) {
                isLoggingIn = false;
                // Shake all boxes on error
                boxes.forEach(b => { b.classList.add('shake'); setTimeout(() => b.classList.remove('shake'), 400); b.value = ''; b.classList.remove('filled'); });
                boxes[0].focus();
                verifyBtn.disabled    = false;
                verifyBtn.textContent = 'Verify & Login';
                showError('Incorrect code. Please try again.');
            }
        });

        // ── Resend & Change Number ─────────────────────────────────────────────────
        document.getElementById('resendCodeBtn').addEventListener('click', async () => {
            document.getElementById('phoneStep2').style.display = 'none';
            document.getElementById('phoneStep1').style.display = 'block';
            document.getElementById('phoneLoginBtn').disabled    = false;
            document.getElementById('phoneLoginBtn').textContent = 'Send Verification Code';
            if (recaptchaVerifier) { recaptchaVerifier.clear(); recaptchaVerifier = null; }
            initRecaptcha();
            hideMessages();
        });

        document.getElementById('changeNumberBtn').addEventListener('click', () => {
            document.getElementById('phoneStep2').style.display = 'none';
            document.getElementById('phoneStep1').style.display = 'block';
            document.getElementById('phoneLoginBtn').disabled    = false;
            document.getElementById('phoneLoginBtn').textContent = 'Send Verification Code';
            hideMessages();
        });

        // ── Google Login (Popup) ───────────────────────────────────────────────────
        googleLoginBtn.addEventListener('click', async () => {
            hideMessages();
            googleLoginBtn.disabled = true; googleLoginBtn.textContent = 'Signing in...';
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                isLoggingIn = true;
                const { user } = await signInWithPopup(auth, provider);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email);
                sessionStorage.setItem('userName',  user.displayName || '');
                sessionStorage.setItem('userId',    user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                isLoggingIn = false;
                if (err.code === 'auth/popup-blocked') {
                    await signInWithRedirect(auth, provider);
                } else {
                    showError(getErrorMessage(err.code));
                    googleLoginBtn.disabled = false; googleLoginBtn.textContent = 'Continue with Google';
                }
            }
        });

        // ── Facebook Login ─────────────────────────────────────────────────────────
        // Try popup first (works on localhost). If popup is blocked (InfinityFreeApp),
        // fall back to redirect — auth_callback.php handles the redirect result.
        facebookLoginBtn.addEventListener('click', async () => {
            hideMessages();
            facebookLoginBtn.disabled = true;
            facebookLoginBtn.textContent = 'Signing in...';
            const provider = new FacebookAuthProvider();
            try {
                // Try popup first
                isLoggingIn = true;
                const { user } = await signInWithPopup(auth, provider);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email || '');
                sessionStorage.setItem('userName',  user.displayName || '');
                sessionStorage.setItem('userId',    user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                    // Popup blocked — fall back to redirect
                    isLoggingIn = false;
                    facebookLoginBtn.textContent = 'Redirecting...';
                    try {
                        await signInWithRedirect(auth, provider);
                    } catch (redirectErr) {
                        showError(getErrorMessage(redirectErr.code));
                        facebookLoginBtn.disabled = false;
                        facebookLoginBtn.textContent = 'Continue with Facebook';
                    }
                } else {
                    isLoggingIn = false;
                    showError(getErrorMessage(err.code));
                    facebookLoginBtn.disabled = false;
                    facebookLoginBtn.textContent = 'Continue with Facebook';
                }
            }
        });

        // ── Forgot Password ────────────────────────────────────────────────────────
        forgotPasswordLink.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) { showError('Please enter your email address first.'); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox.');
            } catch (err) { showError(getErrorMessage(err.code)); }
        });
    </script>
</body>
</html>
