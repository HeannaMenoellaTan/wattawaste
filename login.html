<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Firebase Authentication</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 45px;
            width: 100%;
            max-width: 440px;
            backdrop-filter: blur(10px);
        }

        .logo { text-align: center; margin-bottom: 35px; }
        .logo h1 {
            font-size: 36px; font-weight: 800;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .logo p { color: #666; font-size: 14px; margin-top: 8px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #e0e0e0;
            border-radius: 12px; font-size: 15px; transition: all 0.3s ease; background: white;
        }
        .input-group input:focus {
            outline: none; border-color: #23ed99ff;
            box-shadow: 0 0 0 3px rgba(35, 237, 153, 0.1);
        }

        .forgot-password { text-align: right; margin-bottom: 25px; }
        .forgot-password a { color: #0f8156ff; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
        .forgot-password a:hover { text-decoration: underline; }

        .login-btn {
            width: 100%; padding: 15px;
            background: linear-gradient(135deg, #23ed99ff, #0f8156ff);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(35, 237, 153, 0.3);
        }
        .login-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(35, 237, 153, 0.4); }
        .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider {
            display: flex; align-items: center; margin: 30px 0;
            color: #999; font-size: 13px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
        .divider span { padding: 0 15px; }

        .social-buttons { display: flex; flex-direction: column; gap: 12px; }

        .google-btn, .facebook-btn {
            width: 100%; padding: 14px; background: white; border: 2px solid #e0e0e0;
            border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center;
            justify-content: center; gap: 10px;
        }
        .google-btn:hover:not(:disabled) { border-color: #4285F4; box-shadow: 0 2px 8px rgba(66, 133, 244, 0.2); }
        .facebook-btn { background: #1877f2; color: white; border-color: #1877f2; }
        .facebook-btn:hover:not(:disabled) { background: #166fe5; box-shadow: 0 2px 8px rgba(24, 119, 242, 0.3); }
        .google-btn:disabled, .facebook-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .social-icon { width: 20px; height: 20px; }

        .error-message {
            background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px; display: none;
        }
        .success-message {
            background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px;
            margin-bottom: 20px; font-size: 14px; display: none;
        }

        @media (max-width: 480px) {
            .login-container { padding: 40px 30px; }
            .logo h1 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Welcome Back</h1>
            <p>Login to your account</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your.email@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="emailPassword">Password</label>
                <input type="password" id="emailPassword" placeholder="Enter your password" required>
            </div>
            <div class="forgot-password">
                <a id="forgotPasswordLink">Forgot Password?</a>
            </div>
            <button type="submit" class="login-btn" id="emailLoginBtn">Login with Email</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <div class="social-buttons">
            <button class="google-btn" id="googleLoginBtn">
                <svg class="social-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <button class="facebook-btn" id="facebookLoginBtn">
                <svg class="social-icon" viewBox="0 0 24 24" fill="white">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
                Continue with Facebook
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import {
            getAuth,
            getRedirectResult,
            signInWithEmailAndPassword,
            signInWithPopup,
            signInWithRedirect,
            GoogleAuthProvider,
            FacebookAuthProvider,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getDatabase, ref, set, update, get } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAu9hOwjiuAl9PCh50HefMGZU9XDosu68I",
            authDomain: "wattawaste-d3503.firebaseapp.com",
            databaseURL: "https://wattawaste-d3503-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "wattawaste-d3503",
            storageBucket: "wattawaste-d3503.firebasestorage.app",
            messagingSenderId: "842761118644",
            appId: "1:842761118644:web:ddef65fd892486f67f88e1",
            measurementId: "G-33Z8K3NBY1"
        };

        const app      = initializeApp(firebaseConfig);
        const auth     = getAuth(app);
        const database = getDatabase(app);

        const ADMIN_EMAILS = [
            'tan.heannamenoella.rebolledo@gmail.com',
            'quimoragwyneth61501@gmail.com'
        ];

        // ── DOM ────────────────────────────────────────────────────────────────────
        const loginForm          = document.getElementById('loginForm');
        const errorMessage       = document.getElementById('errorMessage');
        const successMessage     = document.getElementById('successMessage');
        const googleLoginBtn     = document.getElementById('googleLoginBtn');
        const facebookLoginBtn   = document.getElementById('facebookLoginBtn');
        const forgotPasswordLink = document.getElementById('forgotPasswordLink');

        let isLoggingIn = false;

        // ── Helpers ────────────────────────────────────────────────────────────────
        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }
        function showSuccess(msg) {
            successMessage.textContent = msg;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }
        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }
        function getDestination(email) {
            return ADMIN_EMAILS.includes(email) ? 'admin_dashboard.php' : 'index.php';
        }
        function redirectNow(email) {
            const dest = getDestination(email);
            console.log('✅ Redirecting to:', dest);
            window.location.replace(dest);
        }
        function getErrorMessage(code) {
            const map = {
                'auth/invalid-email': 'Invalid email address.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/too-many-requests': 'Too many failed attempts. Please try again later.',
                'auth/network-request-failed': 'Network error. Please check your connection.',
                'auth/popup-closed-by-user': 'Sign-in was cancelled.',
                'auth/cancelled-popup-request': 'Sign-in was cancelled.',
                'auth/popup-blocked': 'Popup was blocked by your browser.',
                'auth/account-exists-with-different-credential': 'An account already exists with this email using a different sign-in method.',
                'auth/operation-not-allowed': 'This sign-in method is not enabled.',
                'auth/unauthorized-domain': 'This domain is not authorized. Contact support.'
            };
            return map[code] || 'An error occurred. Please try again.';
        }

        // ── Sync user to Realtime Database ─────────────────────────────────────────
        async function syncUserToDatabase(user) {
            if (!user || user.isAnonymous) return;
            let provider = 'email', providerId = 'password';
            if (user.providerData?.length > 0) {
                providerId = user.providerData[0].providerId;
                if (providerId === 'google.com')   provider = 'google';
                if (providerId === 'facebook.com') provider = 'facebook';
            }
            const userRef = ref(database, 'users/' + user.uid);
            const userData = {
                name: user.displayName || user.email || 'User',
                Username: user.displayName || user.email || 'User',
                email: user.email || 'N/A',
                Email: user.email || 'N/A',
                role: 'User', Role: 'User',
                status: 'Active', Status: 'Active',
                provider, providerId,
                photoURL: user.photoURL || null,
                phoneNumber: user.phoneNumber || null,
                emailVerified: user.emailVerified || false,
                lastLogin: new Date().toLocaleString(),
                lastActive: new Date().toLocaleString(),
                createdAt: user.metadata.creationTime,
                lastSignInTime: user.metadata.lastSignInTime
            };
            try {
                const snap = await get(userRef);
                if (snap.exists()) {
                    await update(userRef, {
                        lastLogin: userData.lastLogin,
                        lastActive: userData.lastActive,
                        lastSignInTime: userData.lastSignInTime,
                        emailVerified: userData.emailVerified,
                        photoURL: userData.photoURL,
                        phoneNumber: userData.phoneNumber
                    });
                } else {
                    await set(userRef, userData);
                }
            } catch (e) { console.error('DB sync error:', e); }
        }

        // ── Handle redirect result (popup-blocked fallback) ─────────────────────
        try {
            const result = await getRedirectResult(auth);
            if (result?.user) {
                isLoggingIn = true;
                await syncUserToDatabase(result.user);
                sessionStorage.setItem('userEmail', result.user.email || '');
                sessionStorage.setItem('userName',  result.user.displayName || '');
                sessionStorage.setItem('userId',    result.user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(result.user.email), 1000);
            }
        } catch (err) {
            console.error('getRedirectResult error:', err.code, err.message);
            if (err.code && err.code !== 'auth/no-current-user') {
                showError(getErrorMessage(err.code));
            }
        }

        // ── onAuthStateChanged — redirect already-logged-in users ─────────────────
        onAuthStateChanged(auth, (user) => {
            if (isLoggingIn) return;
            if (user && !user.isAnonymous) {
                redirectNow(user.email);
            }
        });

        // ── Email Login ────────────────────────────────────────────────────────────
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            const emailLoginBtn = document.getElementById('emailLoginBtn');
            const email    = document.getElementById('email').value;
            const password = document.getElementById('emailPassword').value;
            emailLoginBtn.disabled = true; emailLoginBtn.textContent = 'Logging in...';
            try {
                isLoggingIn = true;
                const { user } = await signInWithEmailAndPassword(auth, email, password);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email);
                sessionStorage.setItem('userId', user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                isLoggingIn = false;
                showError(getErrorMessage(err.code));
                emailLoginBtn.disabled = false; emailLoginBtn.textContent = 'Login with Email';
            }
        });

        // ── Google Login ───────────────────────────────────────────────────────────
        googleLoginBtn.addEventListener('click', async () => {
            hideMessages();
            googleLoginBtn.disabled = true; googleLoginBtn.textContent = 'Signing in...';
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                isLoggingIn = true;
                const { user } = await signInWithPopup(auth, provider);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email);
                sessionStorage.setItem('userName',  user.displayName || '');
                sessionStorage.setItem('userId',    user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                isLoggingIn = false;
                if (err.code === 'auth/popup-blocked') {
                    await signInWithRedirect(auth, provider);
                } else {
                    showError(getErrorMessage(err.code));
                    googleLoginBtn.disabled = false; googleLoginBtn.textContent = 'Continue with Google';
                }
            }
        });

        // ── Facebook Login ─────────────────────────────────────────────────────────
        facebookLoginBtn.addEventListener('click', async () => {
            hideMessages();
            facebookLoginBtn.disabled = true;
            facebookLoginBtn.textContent = 'Signing in...';
            const provider = new FacebookAuthProvider();
            try {
                isLoggingIn = true;
                const { user } = await signInWithPopup(auth, provider);
                await syncUserToDatabase(user);
                sessionStorage.setItem('userEmail', user.email || '');
                sessionStorage.setItem('userName',  user.displayName || '');
                sessionStorage.setItem('userId',    user.uid);
                showSuccess('Login successful! Redirecting...');
                setTimeout(() => redirectNow(user.email), 1000);
            } catch (err) {
                if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                    isLoggingIn = false;
                    facebookLoginBtn.textContent = 'Redirecting...';
                    try {
                        await signInWithRedirect(auth, provider);
                    } catch (redirectErr) {
                        showError(getErrorMessage(redirectErr.code));
                        facebookLoginBtn.disabled = false;
                        facebookLoginBtn.textContent = 'Continue with Facebook';
                    }
                } else {
                    isLoggingIn = false;
                    showError(getErrorMessage(err.code));
                    facebookLoginBtn.disabled = false;
                    facebookLoginBtn.textContent = 'Continue with Facebook';
                }
            }
        });

        // ── Forgot Password ────────────────────────────────────────────────────────
        forgotPasswordLink.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if (!email) { showError('Please enter your email address first.'); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                showSuccess('Password reset email sent! Check your inbox.');
            } catch (err) { showError(getErrorMessage(err.code)); }
        });
    </script>
</body>
</html>
